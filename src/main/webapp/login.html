<!DOCTYPE html>
<html>
<head>
    <title>AyishaMart - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
        }

        .login-card {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .brand {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            margin-bottom: 30px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #555;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-text {
            margin-top: 25px;
            font-size: 15px;
        }

        .signup-text a {
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="brand">AyishaMart</div>

        <div class="subtitle">
            Welcome back! Please login to continue.
        </div>

        <form action="login" method="post">

            <div class="input-box">
                <label>Username</label>
                <input type="text" name="username"
                       placeholder="Enter your username" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div class="signup-text">
            New user?
            <a href="signup.html">Create Account</a>
        </div>

    </div>

</body>
</html>
