<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AyishaMart - Manage Users</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef8f7;
            color: #263238;
        }

        /* HEADER */

        header {
            background: #123b3a;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        /* MAIN CONTAINER */

        .container {
            width: 92%;
            max-width: 1150px;
            margin: 35px auto;
        }

        /* BACK BUTTON */

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background: #16817a;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin-bottom: 22px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #10635e;
        }

        /* PAGE TITLE */

        .title-box {
            margin-bottom: 22px;
        }

        .title-box h2 {
            margin: 0;
            color: #123b3a;
            font-size: 25px;
        }

        .title-box p {
            color: #667;
            margin-top: 8px;
        }

        /* USERS BOX */

        .users-box {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(18, 59, 58, 0.12);
            overflow-x: auto;
        }

        /* TABLE */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        thead {
            background: #d8f0ed;
        }

        th {
            padding: 15px;
            text-align: center;
            color: #123b3a;
            font-size: 15px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #e4eeee;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f3fbfa;
        }

        /* ROLE BADGES */

        .role {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .admin {
            background: #e8ddff;
            color: #6236a3;
        }

        .seller {
            background: #fff0c9;
            color: #9a6800;
        }

        .buyer {
            background: #d9f5e5;
            color: #18794e;
        }

        /* MESSAGE */

        .message {
            padding: 35px;
            text-align: center;
            color: #718080;
            font-size: 16px;
        }

    </style>

</head>


<body>


<header>

    <h1>AyishaMart Admin</h1>

</header>


<div class="container">


    <a href="admin-dashboard.html"
       class="back-btn">

        ← Back to Dashboard

    </a>


    <div class="title-box">

        <h2>
            Manage Users
        </h2>

        <p>
            View all registered AyishaMart users and their roles.
        </p>

    </div>


    <div class="users-box">


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Username</th>

                    <th>Role</th>

                </tr>

            </thead>


            <tbody id="usersTableBody">

                <tr>

                    <td colspan="3"
                        class="message">

                        Loading users...

                    </td>

                </tr>

            </tbody>

        </table>


    </div>

</div>


<script>


    async function loadUsers() {

        const tableBody =
            document.getElementById(
                "usersTableBody"
            );


        try {

            const response =
                await fetch(
                    "admin-users?format=json"
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to load users"
                );

            }


            const users =
                await response.json();


            tableBody.innerHTML = "";


            if (users.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td colspan="3"
                            class="message">

                            No users found.

                        </td>

                    </tr>

                `;

                return;
            }


            users.forEach(function(user) {


                const row =
                    document.createElement("tr");


                let roleClass = "";


                if (user.role === "ADMIN") {

                    roleClass = "admin";

                } else if (user.role === "SELLER") {

                    roleClass = "seller";

                } else {

                    roleClass = "buyer";

                }


                row.innerHTML = `

                    <td>
                        ${user.id}
                    </td>

                    <td>
                        ${user.username}
                    </td>

                    <td>

                        <span class="role ${roleClass}">

                            ${user.role}

                        </span>

                    </td>

                `;


                tableBody.appendChild(row);

            });


        } catch (error) {

            console.error(
                "Users loading error:",
                error
            );


            tableBody.innerHTML = `

                <tr>

                    <td colspan="3"
                        class="message">

                        Unable to load users.

                    </td>

                </tr>

            `;

        }

    }


    loadUsers();


</script>


</body>

</html>
