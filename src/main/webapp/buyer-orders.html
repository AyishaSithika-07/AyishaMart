<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AyishaMart - My Orders</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        header {
            background: #173f5f;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            width: 92%;
            max-width: 1050px;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: #607d8b;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .back-button:hover {
            background: #455a64;
        }

        h2 {
            margin-bottom: 5px;
            color: #173f5f;
        }

        .subtitle {
            color: #607d8b;
            margin-bottom: 25px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        .order-id {
            font-size: 18px;
            font-weight: bold;
            color: #173f5f;
        }

        .order-total {
            font-size: 19px;
            font-weight: bold;
            color: #00897b;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: #f1f8f7;
            padding: 14px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 12px;
            color: #78909c;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: bold;
            color: #37474f;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 18px;
            color: #37474f;
        }

        .tracking {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            margin: 10px 10px 5px;
        }

        .tracking::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 8%;
            right: 8%;
            height: 4px;
            background: #dce5e7;
            z-index: 0;
        }

        .step {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 25%;
        }

        .circle {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            border-radius: 50%;
            background: #dce5e7;
            color: #607d8b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .step.active .circle {
            background: #00897b;
            color: white;
        }

        .step.active .label {
            color: #00897b;
            font-weight: bold;
        }

        .label {
            font-size: 13px;
            color: #78909c;
        }

        .empty,
        .error {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .error {
            color: #c62828;
        }

        @media (max-width: 700px) {

            .container {
                width: 94%;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .tracking {
                margin-left: 0;
                margin-right: 0;
            }

            .label {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>AyishaMart</h1>
</header>

<div class="container">

    <a href="products.html" class="back-button">
        ← Back to Products
    </a>

    <h2>My Orders</h2>

    <p class="subtitle">
        Track your orders and check their current delivery status.
    </p>

    <div id="ordersContainer">
        <div class="empty">
            Loading your orders...
        </div>
    </div>

</div>

<script>

async function loadOrders() {

    const container =
        document.getElementById("ordersContainer");

    try {

        const response =
            await fetch("buyer-orders?format=json");

        if (!response.ok) {
            throw new Error("Unable to load orders");
        }

        const orders =
            await response.json();

        container.innerHTML = "";

        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    You have not placed any orders yet.
                </div>
            `;

            return;
        }

        orders.forEach(function(order) {

            const card =
                document.createElement("div");

            card.className = "order-card";

            const currentStatus =
                String(order.status || "Pending");

            const statusIndex =
                getStatusIndex(currentStatus);

            card.innerHTML = `
                <div class="order-top">

                    <div class="order-id">
                        Order #${order.orderId}
                    </div>

                    <div class="order-total">
                        ₹${Number(order.totalAmount).toFixed(2)}
                    </div>

                </div>

                <div class="details">

                    <div class="detail-box">
                        <div class="detail-label">
                            Product
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(order.product)}
                        </div>
                    </div>

                    <div class="detail-box">
                        <div class="detail-label">
                            Quantity
                        </div>

                        <div class="detail-value">
                            ${order.quantity}
                        </div>
                    </div>

                    <div class="detail-box">
                        <div class="detail-label">
                            Payment
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(order.paymentMethod)}
                        </div>
                    </div>

                </div>

                <div class="status-title">
                    Current Status:
                    ${escapeHtml(currentStatus)}
                </div>

                <div class="tracking">

                    <div class="step ${statusIndex >= 0 ? "active" : ""}">
                        <div class="circle">1</div>
                        <div class="label">Pending</div>
                    </div>

                    <div class="step ${statusIndex >= 1 ? "active" : ""}">
                        <div class="circle">2</div>
                        <div class="label">Confirmed</div>
                    </div>

                    <div class="step ${statusIndex >= 2 ? "active" : ""}">
                        <div class="circle">3</div>
                        <div class="label">Shipped</div>
                    </div>

                    <div class="step ${statusIndex >= 3 ? "active" : ""}">
                        <div class="circle">4</div>
                        <div class="label">Delivered</div>
                    </div>

                </div>
            `;

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Unable to load your orders.
            </div>
        `;
    }
}


function getStatusIndex(status) {

    const value =
        String(status).toLowerCase();

    if (value === "pending") {
        return 0;
    }

    if (value === "confirmed") {
        return 1;
    }

    if (value === "shipped") {
        return 2;
    }

    if (value === "delivered") {
        return 3;
    }

    return 0;
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadOrders();

</script>

</body>
</html>
