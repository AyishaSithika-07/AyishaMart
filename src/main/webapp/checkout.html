<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AyishaMart - Checkout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #fff1f8,
                #f3e8ff,
                #e8f4ff
            );
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #7b2cbf;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .box h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: bold;
            color: #333;
        }

        .item-details {
            color: #777;
            margin-top: 5px;
        }

        .item-total {
            font-weight: bold;
            color: #7b2cbf;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            font-size: 22px;
            font-weight: bold;
        }

        .payment-option {
            display: block;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
        }

        .payment-option:hover {
            background: #faf5ff;
        }

        .payment-option input {
            margin-right: 10px;
        }

        .place-order-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: #f4c430;
            color: #333;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Checkout</h1>
        <p>Complete your order</p>
    </div>


    <!-- ORDER SUMMARY -->

    <div class="box">

        <h2>🛍️ Order Summary</h2>

        <div id="orderItems"></div>

        <div class="total">
            <span>Total:</span>
            <span id="orderTotal">₹0</span>
        </div>

    </div>


    <!-- PAYMENT METHOD -->

    <div class="box">

        <h2>💳 Payment Method</h2>

        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="COD"
                checked
            >
            Cash on Delivery
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="UPI"
            >
            UPI
        </label>

        <label class="payment-option">
            <input
                type="radio"
                name="payment"
                value="Card"
            >
            Card
        </label>

    </div>


    <!-- PLACE ORDER -->

    <div class="box">

        <button
            id="placeOrderButton"
            class="place-order-button"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>

</div>


<script>

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    // Make sure old cart data does not cause undefined / NaN

    cart = cart.map(function(item) {

        return {
            id: Number(item.id) || 0,
            name: item.name || "Unknown Product",
            price: Number(item.price) || 0,
            quantity: Number(item.quantity) || 1
        };

    });


    function displayOrder() {

        const orderItems =
            document.getElementById("orderItems");

        const orderTotal =
            document.getElementById("orderTotal");

        orderItems.innerHTML = "";


        if (cart.length === 0) {

            orderItems.innerHTML =
                '<div class="empty">Your cart is empty.</div>';

            orderTotal.textContent = "₹0";

            return;
        }


        let total = 0;


        cart.forEach(function(item) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 1;

            const itemTotal =
                price * quantity;

            total += itemTotal;


            const itemDiv =
                document.createElement("div");

            itemDiv.className = "order-item";


            itemDiv.innerHTML = `

                <div>
                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-details">
                        ₹${price} × ${quantity}
                    </div>
                </div>

                <div class="item-total">
                    ₹${itemTotal}
                </div>

            `;


            orderItems.appendChild(itemDiv);

        });


        orderTotal.textContent =
            "₹" + total;

    }


    async function placeOrder() {

        if (cart.length === 0) {

            alert("Your cart is empty!");

            window.location.href =
                "products.html";

            return;
        }


        const selectedPayment =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        if (!selectedPayment) {

            alert(
                "Please select a payment method."
            );

            return;
        }


        const button =
            document.getElementById(
                "placeOrderButton"
            );


        button.disabled = true;

        button.innerText =
            "Placing Order...";


        try {

            const formData =
                new URLSearchParams();


            formData.append(
                "paymentMethod",
                selectedPayment.value
            );


            cart.forEach(function(item) {

                formData.append(
                    "productId",
                    item.id
                );

                formData.append(
                    "quantity",
                    item.quantity
                );

                formData.append(
                    "price",
                    item.price
                );

            });


            const response =
                await fetch(
                    "place-order",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            formData.toString()
                    }
                );


            const result =
                await response.text();


            if (!response.ok) {

                throw new Error(result);

            }


            const orderId =
                result.trim();


            localStorage.setItem(
                "lastOrderId",
                orderId
            );


            localStorage.setItem(
                "paymentMethod",
                selectedPayment.value
            );


            localStorage.removeItem("cart");


            window.location.href =
                "order-success.html";


        } catch (error) {

            console.error(
                "Order placement error:",
                error
            );


            alert(
                "Order placement failed. Please try again."
            );


            button.disabled = false;

            button.innerText =
                "Place Order";
        }

    }


    displayOrder();

</script>

</body>
</html>
