<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AyishaMart - Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f2ff;
        }

        header {
            background: #6a1b9a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .cart-btn {
            background: white;
            color: #6a1b9a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box {
            text-align: center;
            padding: 25px;
        }

        .search-box input {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .products-container {
            padding: 20px 30px 40px;
        }

        #productList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h2 {
            color: #6a1b9a;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product p {
            color: #555;
            min-height: 40px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 12px 0;
        }

        .buy-btn,
        .edit-btn,
        .delete-btn {
            width: 100%;
            padding: 11px;
            border: none;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        .buy-btn {
            background: #6a1b9a;
        }

        .buy-btn:hover {
            background: #4a126d;
        }

        .edit-btn {
            background: #1976d2;
        }

        .edit-btn:hover {
            background: #125a9c;
        }

        .delete-btn {
            background: #d32f2f;
        }

        .delete-btn:hover {
            background: #a52222;
        }
    </style>
</head>

<body>

<header>

    <h1>AyishaMart</h1>

    <button class="cart-btn" onclick="goToCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>

</header>


<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
        onkeyup="searchProducts()"
    >

</div>


<div class="products-container">

    <div id="productList"></div>

</div>


<script>

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let currentUserRole = "NONE";


    // GET LOGGED-IN USER ROLE

    async function loadUserRole() {

        try {

            const response =
                await fetch("user-role");

            if (!response.ok) {

                currentUserRole = "NONE";
                return;
            }

            const role =
                await response.text();

            currentUserRole =
                role.trim().toUpperCase();

        } catch (error) {

            console.error(
                "User role loading error:",
                error
            );

            currentUserRole = "NONE";
        }
    }


    // ADD TO CART

    function addToCart(id, name, price, button) {

        const existingItem =
            cart.find(function(item) {
                return Number(item.id) === Number(id);
            });

        if (existingItem) {

            existingItem.quantity++;

        } else {

            cart.push({
                id: Number(id),
                name: name,
                price: Number(price),
                quantity: 1
            });
        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        updateCartCount();

        button.innerText = "Added ✓";

        setTimeout(function() {

            button.innerText = "Add to Cart";

        }, 1000);
    }


    // UPDATE CART COUNT

    function updateCartCount() {

        let count = 0;

        cart.forEach(function(item) {

            count += Number(item.quantity) || 1;

        });

        document.getElementById("cartCount").innerText =
            count;
    }


    // GO TO CART

    function goToCart() {

        window.location.href = "cart.html";
    }


    // LOAD PRODUCTS

    async function loadProducts() {

        try {

            const response =
                await fetch("seller-products?format=json");

            if (!response.ok) {

                throw new Error(
                    "Products could not be loaded"
                );
            }

            const products =
                await response.json();

            const productList =
                document.getElementById("productList");

            productList.innerHTML = "";


            products.forEach(function(product) {

                const card =
                    document.createElement("div");

                card.className = "product";

                card.setAttribute(
                    "data-product-id",
                    product.id
                );


                // IMAGE

                const image =
                    document.createElement("img");

                image.src =
                    "images/" + product.image;

                image.alt =
                    product.name;


                // NAME

                const title =
                    document.createElement("h2");

                title.innerText =
                    product.name;


                // DESCRIPTION

                const description =
                    document.createElement("p");

                description.innerText =
                    product.description;


                // PRICE

                const price =
                    document.createElement("div");

                price.className =
                    "price";

                price.innerHTML =
                    "&#8377;" +
                    Number(product.price).toFixed(2);


                // ADD TO CART

                const cartButton =
                    document.createElement("button");

                cartButton.className =
                    "buy-btn";

                cartButton.innerText =
                    "Add to Cart";

                cartButton.addEventListener(
                    "click",
                    function() {

                        addToCart(
                            product.id,
                            product.name,
                            Number(product.price),
                            cartButton
                        );

                    }
                );


                // ADD BASIC DETAILS

                card.appendChild(image);
                card.appendChild(title);
                card.appendChild(description);
                card.appendChild(price);
                card.appendChild(cartButton);


                // EDIT + DELETE ONLY FOR SELLER / ADMIN

                if (
                    currentUserRole === "SELLER" ||
                    currentUserRole === "ADMIN"
                ) {

                    const editButton =
                        document.createElement("button");

                    editButton.className =
                        "edit-btn";

                    editButton.innerText =
                        "Edit Product";

                    editButton.addEventListener(
                        "click",
                        function() {

                            window.location.href =
                                "edit-product?id=" +
                                product.id;

                        }
                    );


                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "delete-btn";

                    deleteButton.innerText =
                        "Delete Product";

                    deleteButton.addEventListener(
                        "click",
                        function() {

                            deleteProduct(
                                product.id,
                                card
                            );

                        }
                    );


                    card.appendChild(editButton);
                    card.appendChild(deleteButton);
                }


                productList.appendChild(card);

            });


        } catch (error) {

            console.error(
                "Product loading error:",
                error
            );

            document.getElementById(
                "productList"
            ).innerHTML =
                "<p>Products could not be loaded.</p>";
        }
    }


    // SEARCH PRODUCTS

    function searchProducts() {

        const searchText =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const products =
            document.querySelectorAll(".product");

        products.forEach(function(product) {

            const productName =
                product.querySelector("h2")
                .innerText
                .toLowerCase();

            if (
                productName.includes(searchText)
            ) {

                product.style.display = "";

            } else {

                product.style.display = "none";

            }

        });
    }


    // DELETE PRODUCT

    function deleteProduct(id, card) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this product?"
            );

        if (!confirmDelete) {
            return;
        }


        fetch(
            "delete-product?id=" + id,
            {
                method: "GET"
            }
        )
        .then(function(response) {

            if (response.ok) {

                cart = cart.filter(function(item) {

                    return Number(item.id) !== Number(id);

                });

                localStorage.setItem(
                    "cart",
                    JSON.stringify(cart)
                );

                updateCartCount();

                card.remove();

                alert(
                    "Product deleted successfully!"
                );

            } else {

                alert(
                    "Product delete failed!"
                );
            }

        })
        .catch(function(error) {

            console.error(error);

            alert(
                "Product delete failed!"
            );
        });
    }


    // START

    async function startPage() {

        updateCartCount();

        await loadUserRole();

        await loadProducts();

    }

    startPage();

</script>

</body>
</html>
