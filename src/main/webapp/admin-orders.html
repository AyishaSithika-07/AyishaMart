<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AyishaMart - Admin Orders</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #263238;
        }

        header {
            background: #263238;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            width: 95%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: #546e7a;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .back-button:hover {
            background: #37474f;
        }

        h2 {
            margin-bottom: 5px;
            color: #263238;
        }

        .subtitle {
            color: #607d8b;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #e0f2f1;
            color: #263238;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #eeeeee;
        }

        tr:hover {
            background: #f9ffff;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .shipped {
            background: #dbeafe;
            color: #1e40af;
        }

        .delivered {
            background: #d4edda;
            color: #155724;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #78909c;
        }

        .error {
            text-align: center;
            padding: 25px;
            color: #c62828;
        }
    </style>
</head>

<body>

<header>
    <h1>AyishaMart Admin</h1>
</header>

<div class="container">

    <a href="admin-dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>

    <h2>Manage Orders</h2>

    <p class="subtitle">
        View all customer orders placed in AyishaMart.
    </p>

    <div class="table-box">

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Total Amount</th>
                    <th>Payment</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="ordersTableBody">
                <tr>
                    <td colspan="7" class="empty">
                        Loading orders...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<script>

async function loadOrders() {

    const tableBody =
        document.getElementById("ordersTableBody");

    try {

        const response =
            await fetch("admin-orders?format=json");

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const orders =
            await response.json();

        tableBody.innerHTML = "";

        if (orders.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        No orders found.
                    </td>
                </tr>
            `;

            return;
        }

        orders.forEach(function(order) {

            const row =
                document.createElement("tr");

            const status =
                String(order.status || "Pending")
                    .toLowerCase();

            row.innerHTML = `
                <td>${order.orderId}</td>

                <td>${escapeHtml(order.customer)}</td>

                <td>${escapeHtml(order.product)}</td>

                <td>${order.quantity}</td>

                <td>
                    ₹${Number(order.totalAmount).toFixed(2)}
                </td>

                <td>
                    ${escapeHtml(order.paymentMethod)}
                </td>

                <td>
                    <span class="status ${status}">
                        ${escapeHtml(order.status)}
                    </span>
                </td>
            `;

            tableBody.appendChild(row);
        });

    } catch (error) {

        console.error(error);

        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="error">
                    Unable to load orders.
                </td>
            </tr>
        `;
    }
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadOrders();

</script>

</body>
</html>
